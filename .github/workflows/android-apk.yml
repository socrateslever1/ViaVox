name: Android APK Debug

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: viavox-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35 & Build Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Persist the development-only Android debug certificate between CI runs.
      # Without this, each ephemeral GitHub runner signs with a new key and
      # Android refuses to install subsequent APKs as updates.
      - name: Restore ViaVox debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: viavox-android-development-signing-v1

      - name: Ensure consistent debug signing identity
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 36500 -dname "CN=ViaVox Development, O=ViaVox, C=BR"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -E "Alias name:|SHA256:"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -PviavoxDebugKeystore="$HOME/.android/debug.keystore" :app:assembleDebug

      - name: Verify APK package and signing
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          APK_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          EXPECTED_CERT=$(keytool -exportcert -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | sha256sum | cut -d' ' -f1)
          if [ -z "$APK_CERT" ] || [ "$APK_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::APK certificate does not match the persistent development keystore"
            exit 1
          fi
          echo "APK certificate matches the cached debug signing key."
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 '^package:' | tee /tmp/viavox-package.txt
          grep -q "name='com.socrateslever.viavox'" /tmp/viavox-package.txt
          echo "Correct package identity and valid APK signing verified."

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace -PviavoxDebugKeystore="$HOME/.android/debug.keystore" :app:testDebugUnitTest

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ViaVox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Public direct APK download without needing to extract a GitHub Actions ZIP.
      # This is a non-production DEBUG release; do not use this signing key for Play Store.
      - name: Publish direct APK download
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$CURRENT_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping outdated APK release; main advanced to $CURRENT_SHA"
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/ViaVox.apk"
          if gh release view viavox-debug-latest >/dev/null 2>&1; then
            gh release upload viavox-debug-latest "$RUNNER_TEMP/ViaVox.apk" --clobber
          else
            gh release create viavox-debug-latest "$RUNNER_TEMP/ViaVox.apk" \
              --target "$GITHUB_SHA" --prerelease \
              --title "ViaVox - APK de testes" \
              --notes "APK de testes Android, gerado e validado automaticamente. A instalação deve ser feita pelo arquivo ViaVox.apk. Não é uma versão de produção."
          fi
