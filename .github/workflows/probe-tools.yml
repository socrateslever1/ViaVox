name: Probe external tools (read-only)

# Prints facts about third-party tools (licences, artifact sizes, file layouts)
# so adoption decisions rest on what is actually published. It only reads
# public data and uploads nothing. Runs when this file changes.
on:
  push:
    branches: [ccr-28b73783-qbhfmn]
    paths: ['.github/workflows/probe-tools.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: sherpa-onnx Android package and TTS API
        continue-on-error: true
        run: |
          set +e
          R=k2-fsa/sherpa-onnx
          gh api "repos/$R/releases?per_page=60" -q '.[] | select(.tag_name|test("^v[0-9]")) | .tag_name' | head -3
          TAG=$(gh api "repos/$R/releases?per_page=60" -q '.[] | select(.tag_name|test("^v[0-9]")) | .tag_name' | head -1)
          echo "newest code release: $TAG"
          echo "--- Android assets"
          gh api repos/$R/releases/tags/$TAG -q '.assets[] | select(.name|test("android|aar|jniLibs";"i")) | [.name,.size] | @tsv'
          echo "--- Maven coordinates mentioned in the docs/build files"
          gh api -H "Accept: application/vnd.github.raw" "repos/$R/contents/android/SherpaOnnxTts/app/build.gradle.kts?ref=$TAG" | head -60
          echo "--- Tts.kt: config classes and main calls"
          gh api -H "Accept: application/vnd.github.raw" "repos/$R/contents/sherpa-onnx/kotlin-api/Tts.kt?ref=$TAG" > /tmp/Tts.kt
          grep -nE "^(data )?class |^    fun |^    val |^    var |System.loadLibrary" /tmp/Tts.kt | head -80
          echo "--- layout of the int8 Brazilian voice archive"
          curl -fsSL "https://github.com/$R/releases/download/tts-models/vits-piper-pt_BR-faber-medium-int8.tar.bz2" -o /tmp/faber.tar.bz2
          ls -l /tmp/faber.tar.bz2
          tar tjvf /tmp/faber.tar.bz2 | awk '{print $3, $6}' | grep -v "espeak-ng-data/.*/" | head -30
          echo "espeak-ng-data files: $(tar tjf /tmp/faber.tar.bz2 | grep -c espeak-ng-data/)"

      - name: BRouter as a library
        continue-on-error: true
        run: |
          set +e
          R=abrensch/brouter
          echo "--- module list"
          gh api repos/$R/contents -q '.[].name' | tr '\n' ' '; echo
          echo "--- brouter-core build file"
          gh api -H "Accept: application/vnd.github.raw" "repos/$R/contents/brouter-core/build.gradle" | head -40
          echo "--- jitpack config"
          gh api -H "Accept: application/vnd.github.raw" "repos/$R/contents/jitpack.yml" | head -20
          echo "--- Maven Central / JitPack"
          for u in https://repo1.maven.org/maven2/btools/ https://repo1.maven.org/maven2/org/btools/ https://jitpack.io/com/github/abrensch/brouter/; do printf '%s -> ' $u; curl -fsS -o /dev/null -w '%{http_code}\n' $u; done
          echo "--- profiles for walking and cars"
          for p in trekking trekking-ignore-cr shortest moped car-fast car-eco hiking-beta walking; do printf '%s ' $p; curl -fsSI "https://brouter.de/brouter/profiles2/$p.brf" | head -1 | tr -d '\r'; done
          echo "--- lookups.dat"
          curl -fsSI https://brouter.de/brouter/profiles2/lookups.dat | head -1
          echo "--- how the Android app calls the engine"
          gh api -H "Accept: application/vnd.github.raw" "repos/$R/contents/brouter-server/src/main/java/btools/server/RequestHandler.java" | head -5
          gh api "repos/$R/contents/brouter-core/src/main/java/btools/router" -q '.[].name' | head -30

      - name: Offline vector map assets
        continue-on-error: true
        run: |
          set +e
          for r in protomaps/basemaps protomaps/basemaps-assets; do
            echo; echo "=================== $r  spdx=$(gh api repos/$r/license -q .license.spdx_id)"
            gh api repos/$r/contents -q '.[].name' | tr '\n' ' '; echo
          done
          echo "--- basemaps-assets: fonts"
          gh api repos/protomaps/basemaps-assets/contents/fonts -q '.[].name' | head -20
          echo "--- basemaps-assets: licence files"
          gh api repos/protomaps/basemaps-assets/contents -q '.[] | select(.name|test("LICENSE|README";"i")) | .name'
          echo "--- basemaps: latest release assets"
          gh api repos/protomaps/basemaps/releases/latest -q '.tag_name, (.assets[] | [.name,.size] | @tsv)'
          echo "--- style packages in basemaps"
          gh api repos/protomaps/basemaps/contents/styles -q '.[].name' | head -10
